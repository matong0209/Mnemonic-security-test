<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>博客时间轴</title>
  <style>
    .timeline {
      border-left: 3px solid #0078d4;
      margin: 40px 20px;
      padding-left: 30px;
      position: relative;
    }

    .timeline-entry {
      position: relative;
      margin-bottom: 40px;
    }

    .timeline-entry::before {
      content: "";
      position: absolute;
      top: 0;
      left: -9px;
      width: 16px;
      height: 16px;
      background-color: #0078d4;
      border-radius: 50%;
      border: 2px solid white;
    }

    .timeline-entry a {
      font-size: 16px;
      color: #0078d4;
      text-decoration: none;
    }

    .timeline-entry a:hover {
      text-decoration: underline;
    }

    .timeline-entry del a {
      color: #999;
      text-decoration: line-through;
    }

    .no-underline {
      text-decoration: none !important;
    }
  </style>
</head>
<body>
  <div class="timeline">
    <div class="timeline-entry">
      <del>
        <a href="https://www.matong.xyz" target="_blank">
          www.matong.xyz（服务器域名到期也没保存好数据）
        </a>
      </del>
    </div>

    <div class="timeline-entry">
      <a href="https://www.matong.site" target="_blank" class="no-underline">
        www.matong.site（halo博客，太占内存已放弃）
      </a>
    </div>

    <div class="timeline-entry">
      <a href="https://matong0209.github.io" target="_blank" class="no-underline">
        目前博客采用 hexo 博客 + orange 主题
      </a>
    </div>
  </div>
</body>
</html>
